name: pausable_stream_iterable
description: >-
  Pausable streams of iterables: the single subscription Stream<Iterable<T>> source is paused
  on each non-empty Iterable and is resumed once the Iterable has been iterated to last element.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Wide ranges starting from the first stable null-safe releases.
  async: ">=2.5.0 <3.0.0"
  rxdart: ">=0.26.0 <0.29.0"

dev_dependencies:
  lints: ^6.1.0
  mocktail: ^1.0.4
  test: ^1.25.15
