name: pausable_stream_iterable
description: Pause a single-subscription Stream<Iterable<T>> on each non-empty emitted Iterable, resuming once it has been consumed down to its last element.
version: 1.0.1

repository: https://github.com/cutzmf/pausable_stream_iterable

topics:
  - streams
  - iterable
  - pagination
  - async

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Wide ranges starting from the first stable null-safe releases.
  async: ">=2.5.0 <3.0.0"
  rxdart: ">=0.26.0 <0.29.0"

dev_dependencies:
  lints: ^6.1.0
  mocktail: ^1.0.4
  test: ^1.25.15
